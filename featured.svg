<g class="in" style="animation-delay:1.44s"><text x="28" y="190" fill="#ffa657">▸</text><text x="44.8" y="190" fill="#c9d1d9">Measures the food surface with OpenCV: dark defects, colour consistency, hue drift, texture</text></g>
<g class="in" style="animation-delay:1.62s"><text x="28" y="219" fill="#ffa657">▸</text><text x="44.8" y="219" fill="#c9d1d9">Scores freshness 0-100 with a documented, deterministic formula, from Fresh to Spoiled</text></g>
<g class="in" style="animation-delay:1.80s"><text x="28" y="248" fill="#ffa657">▸</text><text x="44.8" y="248" fill="#c9d1d9">Identifies food with MobileNetV2 on ONNX Runtime: no TensorFlow, nothing to download</text></g>
<g class="in" style="animation-delay:1.98s"><text x="28" y="277" fill="#ffa657">▸</text><text x="44.8" y="277" fill="#c9d1d9">Zero-waste recipes that use what's about to spoil first, never anything assessed as spoiled</text></g>
<g class="in" style="animation-delay:2.16s"><text x="28" y="306" fill="#ffa657">▸</text><text x="44.8" y="306" fill="#c9d1d9">One React Native codebase: a 27-screen Expo app that also ships to the web</text></g>
